<title>Herd Heat Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: farm-office console. Time bar on top, then the day (THI), then pasture map + herd list beside the selected cow. */
:root{
  --bg:#EFF1EA; --surface:#FFFFFF; --surface-2:#F6F7F2; --ink:#1C2A22; --muted:#5D6A61; --line:#DADFD3; --track:#E6EAE0;
  --brand:#2F5E3A; --brand-ink:#FFFFFF; --brand-soft:#E1EBDF;
  --accent:#D9822B; --accent-soft:#FBEBDA;
  --high:#C2412D; --high-soft:#F8E1DB; --mod:#AD7417; --mod-soft:#F6EBD3; --ok:#3B7D4E; --ok-soft:#E0EEE2;
  --info:#2E6C92; --info-soft:#DFEBF3;
  --grass:#D8E5C9; --grass-line:#CCDBBB; --tree:#5F8C4E; --tree-dark:#4A733C; --shade:#BACCA6; --water:#9CC4D7; --yard:#E3DFD3; --building:#B9AE98; --roof:#8E5B45;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111612; --surface:#19201B; --surface-2:#1F2721; --ink:#E4EAE3; --muted:#99A69D; --line:#2D372F; --track:#29322B;
    --brand:#7DB88A; --brand-ink:#0E1A11; --brand-soft:#1F3325;
    --accent:#E59A4E; --accent-soft:#3A2814;
    --high:#F07B67; --high-soft:#3E201B; --mod:#E2A74B; --mod-soft:#382C15; --ok:#6FBF85; --ok-soft:#1C3223;
    --info:#7FB5D7; --info-soft:#1A2B37;
    --grass:#1E291D; --grass-line:#243122; --tree:#3E6034; --tree-dark:#33502B; --shade:#2A3A26; --water:#2C4D5C; --yard:#2A2924; --building:#4A4337; --roof:#6E4636;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111612; --surface:#19201B; --surface-2:#1F2721; --ink:#E4EAE3; --muted:#99A69D; --line:#2D372F; --track:#29322B;
  --brand:#7DB88A; --brand-ink:#0E1A11; --brand-soft:#1F3325;
  --accent:#E59A4E; --accent-soft:#3A2814;
  --high:#F07B67; --high-soft:#3E201B; --mod:#E2A74B; --mod-soft:#382C15; --ok:#6FBF85; --ok-soft:#1C3223;
  --info:#7FB5D7; --info-soft:#1A2B37;
  --grass:#1E291D; --grass-line:#243122; --tree:#3E6034; --tree-dark:#33502B; --shade:#2A3A26; --water:#2C4D5C; --yard:#2A2924; --building:#4A4337; --roof:#6E4636;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0;padding:0 20px}
.wrap{max-width:1200px;margin:0 auto;padding-block:36px 80px;display:flex;flex-direction:column;gap:28px}
.stack{display:flex;flex-direction:column;gap:36px}
@media (max-width:640px){body{padding:0 16px}.wrap{padding-block:24px 56px;gap:20px}.stack{gap:24px}}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.brand p{font-size:13px;color:var(--muted)}
.top-right{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.chip-demo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mod);background:var(--mod-soft);padding:5px 10px;border-radius:999px;white-space:nowrap}

/* time bar */
.timebar{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:14px 28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.play svg{width:18px;height:18px}
.clock{display:flex;flex-direction:column;line-height:1.15}
.clock b{font-family:var(--mono);font-size:24px;font-weight:500}
.clock span{font-size:12px;color:var(--muted);white-space:nowrap}
.slider-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=range]{width:100%;accent-color:var(--brand);margin:0}
.slider-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tb-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--high);border-color:var(--high);color:var(--surface)}
@media (max-width:820px){
  .timebar{grid-template-columns:auto minmax(0,1fr)}
  .slider-wrap{grid-column:1/-1}
  .tb-actions{grid-column:1/-1}
}

/* tabs */
.tabs{display:flex;gap:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 6px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--mono);font-size:11px;background:var(--high);color:var(--surface);border-radius:999px;padding:1px 7px}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;background:var(--high-soft);border:1px solid color-mix(in srgb,var(--high) 35%,transparent);border-radius:16px;padding:22px 26px}
.banner .dot{width:12px;height:12px;border-radius:50%;background:var(--high);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--high) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.banner .msg{flex:1 1 300px;min-width:0}
.banner strong{display:block;font-family:var(--display);font-size:18px;color:var(--high);margin-bottom:4px}
.banner span{font-size:14px}
.banner.calm{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.calm strong{color:var(--ok)} .banner.calm .dot{background:var(--ok);animation:none}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.1}
.tile .v small{font-size:13px;color:var(--muted);margin-left:3px}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile .pill{white-space:normal;max-width:100%}
.tile.hot .v{color:var(--high)} .tile.warm .v{color:var(--mod)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:16px}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:640px){.panel{padding:22px 18px;gap:18px}}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.ph p{font-size:13px;color:var(--muted)}
.panel > .ph:not(:first-child),.subbody > .ph:not(:first-child){margin-top:14px}
.today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:start}
.col{display:flex;flex-direction:column;gap:36px;min-width:0}
.work{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:32px;align-items:start}
.work-list{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);min-width:0}
.work-list .panel{padding:24px 22px;gap:16px}
.work-list .herd{max-height:calc(100vh - 210px);overflow-y:auto;margin-inline:-8px;padding-inline:8px}
.cowcard{gap:20px}
.subtabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.subtabs button{flex:1 1 0;border:0;background:none;border-radius:9px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.subbody{display:flex;flex-direction:column;gap:22px;min-width:0}
.subbody > .ph:first-child{margin-top:0}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr);gap:28px}.work-list{position:static}.work-list .herd{max-height:380px}}
@media (max-width:980px){.today{grid-template-columns:minmax(0,1fr);gap:28px}.col{gap:28px}}

/* charts */
.chart-svg{width:100%;height:auto;display:block;cursor:pointer}
.chart-svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.map-svg{width:100%;height:auto;display:block;border-radius:10px}
.map-svg text{font-family:var(--sans);font-size:12px;fill:var(--ink);font-weight:700}
.map-svg .cow{cursor:pointer}
.map-svg .lbl{font-family:var(--mono);font-size:11px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.sq{border-radius:3px}

/* herd list */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.herd{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 40px;align-items:center;gap:14px;border:0;border-top:1px solid var(--line);background:none;padding:14px 10px;text-align:left;width:100%;border-radius:10px}
.hrow:first-child{border-top:0}
.hrow:hover+.hrow,.hrow[aria-pressed="true"]+.hrow{border-top-color:transparent}
.hrow:hover{background:var(--surface-2)}
.hrow[aria-pressed="true"]{background:var(--brand-soft)}
.hrow .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hrow .who b{font-family:var(--mono);font-weight:500;font-size:14px}
.hrow .who b em{font-family:var(--sans);font-style:normal;font-weight:600;margin-left:4px}
.hrow .who span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.high{background:var(--high)}.dot.mod{background:var(--mod)}.dot.ok{background:var(--ok)}
.hrow .who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .where{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:12px;background:var(--track);border-radius:3px}
.bar .band{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.28}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar .th{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--high);opacity:.75}


/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;justify-self:start}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.high{color:var(--high);background:var(--high-soft)} .pill.mod{color:var(--mod);background:var(--mod-soft)} .pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.info{color:var(--info);background:var(--info-soft)} .pill.plain{color:var(--muted);background:var(--surface-2)}

/* detail */
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px}
.d-head h2{font-size:23px}
.d-head p{font-size:13px;color:var(--muted)}
.likely{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;align-items:center;padding-block:4px}
.likely .big{font-family:var(--mono);font-size:48px;font-weight:500;line-height:1}
.likely .rng{display:flex;flex-direction:column;gap:6px;min-width:0}
.likely .rng .bar{height:14px}
.likely .rng small{font-size:12.5px;color:var(--muted)}
.statusline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.where-box{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface-2);border-radius:14px;padding:16px 18px}
.where-box svg{width:44px;height:44px}
.where-box b{display:block;font-size:15px}
.where-box span{font-size:13px;color:var(--muted)}
.why{display:flex;flex-direction:column;gap:12px}
.why .row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 18px;align-items:center}
.why .row .lab{font-size:14px}
.why .row .lab span{color:var(--muted);font-size:12.5px}
.why .row .mini{height:8px;background:var(--track);border-radius:3px;position:relative}
.why .row .mini i{position:absolute;inset:0 auto 0 0;background:var(--high);border-radius:3px}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{display:flex;gap:12px;align-items:flex-start;background:var(--mod-soft);border-radius:14px;padding:16px 18px;font-size:13px}
.warnbox svg{width:18px;height:18px;flex:none;color:var(--mod);margin-top:1px}
.infobox{display:flex;gap:12px;align-items:flex-start;background:var(--info-soft);border-radius:14px;padding:16px 18px;font-size:13px}
.infobox svg{width:18px;height:18px;flex:none;color:var(--info);margin-top:1px}
.locked{border:1px dashed var(--line);border-radius:14px;padding:18px 20px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.locked svg{width:18px;height:18px;flex:none;margin-top:1px}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.sigs{grid-template-columns:minmax(0,1fr)}}
.sig{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sig h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.sig h4 small{font-weight:600;letter-spacing:0;text-transform:none}
.sig dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;font-size:13.5px}
.sig dt{color:var(--ink)} .sig dd{margin:0;text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
.sig dd.flag{color:var(--high)} .sig dd.gap{color:var(--mod)}
.sig dd small{color:var(--muted);font-family:var(--sans);font-size:11.5px}
.advice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.advice li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;font-size:14px;background:var(--surface-2);border-radius:12px;padding:14px 16px}
.advice li svg{width:18px;height:18px;margin-top:2px;color:var(--brand)}

/* check form */
.check{border:2px solid var(--brand);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.check.done{border-color:var(--line);border-width:1px;background:var(--surface-2)}
.check .q{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline}
.check .q .n{font-family:var(--mono);font-size:12px;color:var(--brand);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px 10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.call[aria-pressed="true"][data-v="heat"]{background:var(--high-soft);border-color:var(--high);box-shadow:inset 0 0 0 1px var(--high)}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:14px;resize:vertical}
.cb{display:flex;align-items:center;gap:8px;font-size:13.5px}
.cb input{accent-color:var(--brand);width:16px;height:16px}
.err{color:var(--high);font-size:13px;font-weight:700}
.collar{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
.collar b{color:var(--ink);font-weight:600}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

/* generic grids */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr);gap:28px}}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:14px}
.list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.list li svg{width:18px;height:18px;margin-top:2px}
.list .yes svg{color:var(--ok)} .list .no svg{color:var(--high)}
.share-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.share-row:first-of-type{border-top:0}
.share-row b{font-size:14.5px}
.share-row p{font-size:13px;color:var(--muted);grid-column:1}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track);border:1px solid var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--brand);border-color:var(--brand)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.lockchip{font-size:12px;font-weight:700;color:var(--info);background:var(--info-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.meter{display:flex;gap:6px}
.meter i{flex:1;height:10px;border-radius:3px;background:var(--track)}
.meter i.on{background:var(--high)}
.summary-doc{border:1px solid var(--line);border-radius:14px;padding:22px 24px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px;font-size:14px}
.summary-doc dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 22px}
.summary-doc dt{color:var(--muted);font-size:13px}
.summary-doc dd{margin:0}
.slider-row{display:flex;flex-direction:column;gap:12px}
.slider-row .vals{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tradeoff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tradeoff div{background:var(--surface-2);border-radius:14px;padding:16px 18px}
.tradeoff b{font-family:var(--mono);font-size:20px;font-weight:500;display:block}
.tradeoff span{font-size:12.5px;color:var(--muted)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;position:relative}
.step{border:1px solid var(--line);border-radius:16px;padding:20px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.step .tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step b{font-family:var(--display);font-size:16px}
.step p{font-size:13px;color:var(--muted)}
.step .risk{font-size:12px;color:var(--high);border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.step.human{border:2px solid var(--brand)}
.step.human .risk{color:var(--brand)}
.loop{grid-column:2/-1;border:2px solid var(--brand);border-top:0;height:16px;border-radius:0 0 12px 12px;margin-top:-4px;position:relative}
.loop-label{grid-column:2/-1;text-align:center;font-size:12.5px;color:var(--brand);font-weight:700;margin-top:-4px}
@media (max-width:900px){.pipe{grid-template-columns:minmax(0,1fr)}.loop,.loop-label{display:none}}

.empty{text-align:center;padding:44px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--ok)}
.empty b{color:var(--ink);font-family:var(--display);font-size:18px}

/* phone notification */
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.28);display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;z-index:20;animation:rise .35s ease}
.toast .ic{width:34px;height:34px;border-radius:9px;background:var(--high);display:grid;place-items:center;grid-row:span 2;color:var(--surface)}
.toast.good .ic{background:var(--ok)}
.toast .ic svg{width:18px;height:18px}
.toast b{font-size:14px}
.toast span{font-size:13px;opacity:.85}
.toast .acts{grid-column:2;display:flex;gap:8px;margin-top:6px}
.toast .acts button{border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;background:var(--bg);color:var(--ink)}
.toast .acts button.ghost{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.toast .app{grid-column:2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;order:-1}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.banner .dot,.toast{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cite{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;margin-left:2px;vertical-align:super;line-height:0}
.cite a{color:var(--muted);text-decoration:none}
.cite a:hover{color:var(--accent);text-decoration:underline}
.srclink{color:var(--muted);text-decoration:none;opacity:.7}
.srclink:hover{opacity:1;text-decoration:underline}
.refs{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.refs li{padding:4px 6px;border-radius:6px;overflow-wrap:anywhere}
.refs li.hl{background:var(--accent-soft)}
.refs a,.reflink{color:var(--brand)}
.rulepath{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:4px;font-size:12.5px}
.rulepath .note{width:100%}
.rulepath .node{font-family:var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.rulepath .node.yes{border-color:var(--high);color:var(--high)}
.rulepath .node.no{color:var(--muted)}
.rulepath .node.leaf{font-weight:500}
.rulepath .node.leaf.high{background:var(--high-soft);color:var(--high);border-color:transparent}
.rulepath .node.leaf.mod{background:var(--mod-soft);color:var(--mod);border-color:transparent}
.rulepath .node.leaf.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rulepath .arr{color:var(--muted)}
.scorebox{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-radius:12px;padding:12px 16px;font-size:13.5px;background:var(--ok-soft)}
.scorebox.s1,.scorebox.s2{background:var(--mod-soft)}
.scorebox.s3{background:var(--high-soft)}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:24px;margin-top:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
